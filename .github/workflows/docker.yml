name: docker

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and smoke-test the image
        run: |
          docker build --tag headcleaner:ci .
          docker run --rm --entrypoint sh \
            -v "${{ github.workspace }}/tests/fixtures:/fixtures:ro" \
            headcleaner:ci \
            -c 'mkdir -p /tmp/pst && readpst -e -q -o /tmp/pst /fixtures/outlook.pst && test -n "$(find /tmp/pst -type f -print -quit)"'

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/jamesdsizemore/headcleaner-cli:${{ steps.meta.outputs.VERSION }}
            ghcr.io/jamesdsizemore/headcleaner-cli:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
