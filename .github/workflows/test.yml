name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install OfficeCLI
        run: npm install -g @officecli/officecli

      - name: Install zsv
        run: |
          curl -fsSLO https://github.com/liquidaty/zsv/releases/download/v1.4.3/zsv-1.4.3-amd64-linux-gcc.deb
          sudo apt-get install -y ./zsv-1.4.3-amd64-linux-gcc.deb

      - name: Sync deps
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run pytest
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest -v
