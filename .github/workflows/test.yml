name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install OfficeCLI
        run: npm install -g @officecli/officecli

      - name: Install zsv
        run: |
          curl -fsSLO https://github.com/liquidaty/zsv/releases/download/v1.4.3/zsv-1.4.3-amd64-linux-gcc.deb
          sudo apt-get install -y ./zsv-1.4.3-amd64-linux-gcc.deb

      - name: Install PST extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y pst-utils

      - name: Sync deps
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run pytest
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest -v

  legacy-office-integration:
    name: legacy-office-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install 3.12

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libreoffice

      - name: Sync test dependencies
        run: uv sync --group dev --python 3.12

      - name: Exercise real legacy Office conversions
        run: uv run --no-sync --python 3.12 pytest tests/test_legacy_office.py -v
