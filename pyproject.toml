[project]
name = "headcleaner"
version = "0.8.0"
description = "HeadCleaner CLI - walk a folder, convert every document to Markdown and/or OKF v0.2 with frontmatter."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "James Sizemore", email = "jamesdsizemore@gmail.com" }]
keywords = ["markdown", "okf", "knowledge-graph", "converter", "cli", "ocr", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
requires-python = ">=3.12,<3.14"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pdfplumber>=0.11",
  "pypdf>=5.0",
  "chardet>=5.2",
  "markdownify>=0.13",
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13.7",
  "textual>=0.86",
  "extract-msg>=0.54",
  "watchfiles>=0.21",
  # Batch 5 (Eng #7, #8, #9)
  "ebooklib>=0.18",
  "striprtf>=0.0.26",
  "odfpy>=1.4.1",
  # Batch 6 (Eng #22 full serve)
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]
pst = ["libpff-python>=20231205"]  # binary wheels: Windows + macOS arm64; see FORMAT_MATRIX.md
odf = ["odfpy>=1.4"]
epub = ["ebooklib>=0.18"]
all = ["headcleaner[ocr,pst,odf,epub]"]

[project.scripts]
headcleaner = "headcleaner.cli:main"
headcleaner-lint = "headcleaner.lint:main"

[project.urls]
Homepage = "https://github.com/local/headcleaner"
Issues = "https://github.com/local/headcleaner/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headcleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
