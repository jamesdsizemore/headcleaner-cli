[project]
name = "headcleaner"
version = "0.14.0"
description = "HeadCleaner CLI - walk a folder, convert every document to Markdown and/or OKF v0.2 with frontmatter."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "James Sizemore", email = "jamesdsizemore@gmail.com" }]
keywords = ["markdown", "okf", "knowledge-graph", "converter", "cli", "ocr", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
requires-python = ">=3.12,<3.14"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pdfplumber>=0.11",
  "pypdf>=5.0",
  "chardet>=5.2",
  "markdownify>=0.13",
  "pyyaml>=6.0",
  "tomli-w>=1.0",
  "click>=8.1",
  "rich>=13.7",
  "textual>=0.86",
  "extract-msg>=0.54",
  "watchfiles>=0.21",
  # Batch 5 (Eng #7, #8, #9)
  "ebooklib>=0.18",
  "striprtf>=0.0.26",
  "odfpy>=1.4.1",
  # Batch 6 (Eng #22 full serve)
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "rapidfuzz==3.14.5",
  "sentence-transformers==6.0.0",
  "qdrant-client==1.19.0",
  "mcp==1.29.0",
  "in-toto==3.1.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]
pst = ["libpff-python>=20231205"]  # binary wheels: Windows + macOS arm64; see FORMAT_MATRIX.md
odf = ["odfpy>=1.4"]
epub = ["ebooklib>=0.18"]
all = ["headcleaner[ocr,pst,odf,epub]"]

[project.scripts]
headcleaner = "headcleaner.cli:main"
headcleaner-lint = "headcleaner.lint:main"

[project.urls]
Homepage = "https://github.com/jamesdsizemore/headcleaner-cli"
Issues = "https://github.com/jamesdsizemore/headcleaner-cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headcleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"



[tool.ruff.lint.per-file-ignores]
"src/headcleaner/viewer.py" = ["E501"]  # Vendored HTML template with long script tags
"tests/conftest.py" = ["E501"]  # Hand-rolled binary fixtures
"tests/test_office_oxide.py" = ["E501"]  # Long assertion fixtures
"tests/test_clean_pipeline.py" = ["E501"]  # Long assertion fixtures
"src/headcleaner/cli.py" = ["E501"]  # Long help= strings + f-strings inside multi-line calls
"src/headcleaner/serve.py" = ["E501"]  # Long help= strings + f-strings inside multi-line calls
"src/headcleaner/lint.py" = ["E501"]  # Long help= strings + f-strings inside multi-line calls
"src/headcleaner/engines/pdf.py" = ["E501"]  # Long help= strings + f-strings inside multi-line calls
"tests/test_viewer.py" = ["E501"]  # Long help= strings + f-strings inside multi-line calls

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[project.entry-points."headcleaner_plugin"]
# Third-party adapters go here. Example (not registered):
# my_format = "yourpkg.adapters:MyFormatAdapter"

[dependency-groups]
dev = [
    "all2md>=1.12.0",
    "babel>=2.17",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "office-oxide>=0.1.8",
    "pytest>=9.1.1",
    "ruff>=0.16",
]
